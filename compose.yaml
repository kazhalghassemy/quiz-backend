name: quiz

services:
  postgres:
    image: postgres:17
    container_name: quiz-postgres
    environment:
      POSTGRES_DB: quizdb
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Bitte POSTGRES_PASSWORD in .env setzen}
    ports:
      - "127.0.0.1:5433:5432"      # nur für IntelliJ und das Datenbank-Tool
    volumes:
      - quiz-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quizdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    build: .
    image: quiz-backend:1.0
    container_name: quiz-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quizdb
      SPRING_DATASOURCE_USERNAME: quiz
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      QUIZ_ADMIN_EMAIL: ${QUIZ_ADMIN_EMAIL:-admin@quiz.local}
      QUIZ_ADMIN_PASSWORD: ${QUIZ_ADMIN_PASSWORD:?Bitte QUIZ_ADMIN_PASSWORD in .env setzen}
      QUIZ_CORS_ALLOWED_ORIGINS: ${QUIZ_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      TZ: Europe/Berlin
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c",
        "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' 
>&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5
    mem_limit: 768m
    stop_grace_period: 30s
    restart: unless-stopped
volumes:
  quiz-data: