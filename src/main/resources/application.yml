spring:
  application:
    name: quiz-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 20
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,beans,configprops,env,conditions,loggers

quiz:
  default-time-limit: 30s
  max-points-per-question: 100
  multiple-choice:
    scoring: ALL_OR_NOTHING
