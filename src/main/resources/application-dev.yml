spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

  datasource:
    url: jdbc:postgresql://localhost:5433/quizdb
    username: quiz
    password: quiz

  web:
    error:
      include-message: always
      include-binding-errors: always


logging:
  level:
    de.kazhal.quizbackend: DEBUG # dein eigener Code: gesprächig
    de.kazhal.quizbackend.question.evaluation.FreeTextEvaluator: TRACE # nur diese Klasse: maximal gesprächig
    org.hibernate.SQL: DEBUG  # zeigt jedes SQL-Statement
    org.flywaydb: INFO # Flyway: nur das Wichtigste
  file:
    name: logs/quiz-backend.log # Log zusätzlich in diese Datei schreiben

management:
  endpoint:
    health:
      show-details: always # /actuator/health zeigt auch DB-Status usw., nicht nur "UP"
    env:
      show-values: always # /actuator/env zeigt echte Werte statt ******
    configprops:
      show-values: always # /actuator/configprops ebenso

quiz:
  multiple-choice:
    scoring: PARTIAL
  admin:
    email: admin@quiz.local
    password: admin12345

